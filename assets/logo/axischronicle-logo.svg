<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" role="img" aria-labelledby="title desc">
  <title id="title">AxisChronicle — SQUARGRAPH mark study</title>
  <desc id="desc">A dark forest-green circle with SQUARGRAPH's white open-diamond emblem, paired with the AxisChronicle wordmark.</desc>
  <style>
    @font-face { font-family: Satoshi; src: url("../fonts/Satoshi-Regular.woff") format("woff"); font-weight: 400; }
    @font-face { font-family: Satoshi; src: url("../fonts/Satoshi-Medium.woff") format("woff"); font-weight: 500; }
    @font-face { font-family: Satoshi; src: url("../fonts/Satoshi-Bold.woff") format("woff"); font-weight: 700; }
    .word { font-family: Satoshi, Arial, sans-serif; font-size: 46px; letter-spacing: 2.8px; }
  </style>
  <g transform="translate(20 16)">
    <circle cx="64" cy="64" r="64" fill="#1C3025"/>
    <path d="M64 20 18 64 64 108 112 64 89 42" fill="none" stroke="#FAFAF9" stroke-width="6" stroke-linecap="butt" stroke-linejoin="bevel"/>
  </g>
  <text class="word" x="190" y="88" fill="#FAFAF9" font-weight="700">AXIS</text>
  <circle cx="322" cy="72" r="3.2" fill="#D8E9A1"/>
